services:
  postgres:
    image: postgres:17.10-alpine
    container_name: learn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learner_password
      POSTGRES_DB: learn_tasks
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learner -d learn_tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-alpine
    container_name: learn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: learn-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://learner:learner_password@postgres:5432/learn_tasks
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: learn-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
